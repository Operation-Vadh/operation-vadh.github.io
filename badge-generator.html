<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operation Vadh | Support Badge Generator</title>
    <meta
      name="description"
      content="Generate a digital support badge for Operation Vadh and share it online."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #050505;
        --panel: #111111;
        --panel-strong: #171717;
        --text: #f5f1ec;
        --muted: #d0c7be;
        --accent: #9f1d1d;
        --accent-soft: rgba(159, 29, 29, 0.25);
        --border: rgba(255, 255, 255, 0.08);
        --shadow: rgba(0, 0, 0, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
      }

      body {
        display: flex;
        justify-content: center;
        padding: 32px 20px 56px;
      }

      .page-shell {
        width: min(1200px, 100%);
      }

      .topbar {
        text-align: center;
        margin-bottom: 24px;
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 14px;
        border: 1px solid var(--border);
        letter-spacing: 0.22em;
        font-size: 0.72rem;
        color: var(--text);
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: clamp(2rem, 4vw, 3.5rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .subtitle {
        color: var(--muted);
        letter-spacing: 0.08em;
        font-size: 0.92rem;
      }

      .generator-layout {
        display: grid;
        grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }

      .panel {
        background: linear-gradient(180deg, rgba(19, 19, 19, 0.92), rgba(9, 9, 9, 0.92));
        border: 1px solid var(--border);
        box-shadow: 0 22px 48px var(--shadow);
      }

      .form-panel {
        padding: 26px 22px 18px;
      }

      .section-title {
        margin: 0 0 18px;
        font-size: 1.4rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .field {
        display: block;
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .field input,
      .field textarea {
        width: 100%;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px 14px;
        font: inherit;
        resize: vertical;
      }

      .field input:focus,
      .field textarea:focus {
        outline: 2px solid var(--accent-soft);
        border-color: rgba(255, 255, 255, 0.18);
      }

      .field textarea {
        min-height: 104px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
      }

      .button {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .button.primary {
        background: var(--accent);
        border-color: rgba(255, 255, 255, 0.12);
      }

      .share-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .share-btn {
        flex: 1 1 84px;
        min-width: 84px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 12px;
        cursor: pointer;
        font: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .preview-panel {
        padding: 16px;
      }

      .preview-frame {
        width: 100%;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        padding: 16px;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        max-height: 68vh;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .footer-note {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-align: center;
      }

      @media (max-width: 840px) {
        .generator-layout {
          grid-template-columns: 1fr;
        }

        body {
          padding-left: 14px;
          padding-right: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="topbar">
        <div class="eyebrow">#OPERATIONVADH</div>
        <h1>Support Badge</h1>
        <p class="subtitle">Create a statement of support and share it with the world.</p>
      </div>

      <main class="generator-layout">
        <section class="panel form-panel" aria-label="Badge generator form">
          <h2 class="section-title">Generate Badge</h2>

          <form id="badgeForm">
            <div class="field">
              <label for="nameInput">Full Name</label>
              <input id="nameInput" name="name" type="text" value="Alex Morgan" maxlength="28" />
            </div>

            <div class="field">
              <label for="handleInput">Alias / Handle</label>
              <input id="handleInput" name="handle" type="text" value="@ghostwatcher" maxlength="24" />
            </div>

            <div class="field">
              <label for="messageInput">Support Message</label>
              <textarea id="messageInput" name="message">I stand with Operation Vadh to expose cybercrime and protect the internet.</textarea>
            </div>

            <div class="button-row">
              <button class="button primary" type="submit">Generate</button>
              <button class="button" id="downloadBtn" type="button">Download PNG</button>
            </div>
          </form>

          <div class="share-row" aria-label="Share the badge">
            <button class="share-btn" data-share="x" type="button">X</button>
            <button class="share-btn" data-share="linkedin" type="button">LinkedIn</button>
            <button class="share-btn" data-share="telegram" type="button">Telegram</button>
            <button class="share-btn" data-share="whatsapp" type="button">WhatsApp</button>
          </div>
        </section>

        <section class="panel preview-panel" aria-label="Badge preview">
          <div class="preview-frame">
            <canvas id="badgeCanvas" width="1200" height="760" aria-label="Badge preview canvas"></canvas>
          </div>
          <div class="footer-note">Badge is generated locally in your browser.</div>
        </section>
      </main>
    </div>

    <script>
      const canvas = document.getElementById('badgeCanvas');
      const ctx = canvas.getContext('2d');
      const form = document.getElementById('badgeForm');
      const nameInput = document.getElementById('nameInput');
      const handleInput = document.getElementById('handleInput');
      const messageInput = document.getElementById('messageInput');

      const baseUrl = 'https://operation-vadh.github.io/';

      function wrapText(text, maxWidth) {
        const words = text.split(' ');
        const lines = [];
        let current = '';

        for (const word of words) {
          const test = current ? current + ' ' + word : word;
          if (ctx.measureText(test).width > maxWidth && current) {
            lines.push(current);
            current = word;
          } else {
            current = test;
          }
        }

        if (current) lines.push(current);
        return lines;
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      function renderBadge() {
        const name = (nameInput.value || 'Supporter').trim() || 'Supporter';
        const handle = (handleInput.value || '@operationvadh').trim() || '@operationvadh';
        const message = (messageInput.value || 'I stand with Operation Vadh.').trim() || 'I stand with Operation Vadh.';

        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        const background = ctx.createRadialGradient(width / 2, height / 2, 80, width / 2, height / 2, width * 0.82);
        background.addColorStop(0, '#171717');
        background.addColorStop(0.5, '#090909');
        background.addColorStop(1, '#000000');
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        for (let x = 0; x < width; x += 48) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }

        for (let y = 0; y < height; y += 48) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        roundedRect(66, 56, width - 132, height - 112, 28);
        ctx.fillStyle = 'rgba(17,17,17,0.96)';
        ctx.fill();
        ctx.strokeStyle = '#7c1212';
        ctx.lineWidth = 6;
        ctx.stroke();

        ctx.fillStyle = '#f5f1ec';
        ctx.font = '700 24px "JetBrains Mono", monospace';
        ctx.letterSpacing = '0.24em';
        ctx.textAlign = 'left';
        ctx.fillText('#OPERATIONVADH', 96, 116);

        ctx.fillStyle = '#a82323';
        ctx.font = '800 76px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('SUPPORTER BADGE', width / 2, 190);

        ctx.strokeStyle = '#a82323';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(150, 219);
        ctx.lineTo(width - 150, 219);
        ctx.stroke();

        ctx.fillStyle = '#f5f1ec';
        ctx.font = '800 96px "JetBrains Mono", monospace';
        const nameLines = wrapText(name, 650);
        const nameY = 380;
        nameLines.forEach((line, index) => {
          ctx.fillText(line, width / 2, nameY + index * 92);
        });

        ctx.fillStyle = '#d7cfc4';
        ctx.font = '600 28px "JetBrains Mono", monospace';
        ctx.fillText(handle, width / 2, 560);

        ctx.fillStyle = '#e8ddd3';
        ctx.font = '500 30px "JetBrains Mono", monospace';
        const messageLines = wrapText(message, 800);
        messageLines.forEach((line, index) => {
          ctx.fillText(line, width / 2, 620 + index * 38);
        });

        ctx.fillStyle = '#9a1d1d';
        ctx.font = '700 22px "JetBrains Mono", monospace';
        ctx.fillText('WE FIGHT CYBER CRIME • WE PROTECT THE INTERNET', width / 2, 700);

        ctx.fillStyle = '#f5f1ec';
        ctx.font = '700 18px "JetBrains Mono", monospace';
        ctx.fillText('operation-vadh.github.io', width / 2, 734);

        ctx.fillStyle = '#a82323';
        ctx.beginPath();
        ctx.moveTo(width - 260, 130);
        ctx.lineTo(width - 190, 172);
        ctx.lineTo(width - 210, 250);
        ctx.lineTo(width - 300, 250);
        ctx.lineTo(width - 320, 172);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#121212';
        ctx.font = '800 38px "JetBrains Mono", monospace';
        ctx.fillText('V', width - 255, 210);
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        renderBadge();
      });

      document.getElementById('downloadBtn').addEventListener('click', function () {
        const safeName = (nameInput.value || 'supporter').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'supporter';
        const link = document.createElement('a');
        link.download = `operation-vadh-support-badge-${safeName}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });

      document.querySelectorAll('.share-btn').forEach((button) => {
        button.addEventListener('click', function () {
          const platform = this.dataset.share;
          const shareText = `I support Operation Vadh and stand against cybercrime. ${baseUrl}`;
          const encodedText = encodeURIComponent(shareText);
          const url = encodeURIComponent(baseUrl);

          let shareUrl = '';

          if (platform === 'x') {
            shareUrl = `https://twitter.com/intent/tweet?text=${encodedText}`;
          } else if (platform === 'linkedin') {
            shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`;
          } else if (platform === 'telegram') {
            shareUrl = `https://t.me/share/url?url=${url}&text=${encodedText}`;
          } else if (platform === 'whatsapp') {
            shareUrl = `https://wa.me/?text=${encodedText}`;
          }

          if (shareUrl) {
            window.open(shareUrl, '_blank', 'noopener,noreferrer');
          }
        });
      });

      renderBadge();
    </script>
  </body>
</html>
