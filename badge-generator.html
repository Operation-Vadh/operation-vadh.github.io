<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operation Vadh | Certificate Generator</title>
    <meta name="description" content="Generate polished Operation Vadh support certificates with default or custom content." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
    <style>
      :root {
        --bg: #050505;
        --panel: #111111;
        --card: rgba(20,20,20,0.96);
        --text: #f5f1ec;
        --muted: #d6cabf;
        --accent: #a51e1e;
        --accent-2: #c52d2d;
        --border: rgba(255,255,255,0.12);
        --shadow: rgba(0,0,0,0.50);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
      }

      body {
        display: flex;
        justify-content: center;
        padding: 28px 18px 52px;
      }

      .page-shell {
        width: min(1260px, 100%);
      }

      .topbar {
        text-align: center;
        margin-bottom: 24px;
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 14px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        letter-spacing: 0.2em;
        font-size: 0.72rem;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: clamp(2rem, 4vw, 3.5rem);
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        letter-spacing: 0.08em;
      }

      .mode-switch {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 22px auto 26px;
      }

      .mode-btn {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .mode-btn.active {
        background: linear-gradient(180deg, var(--accent-2), var(--accent));
        border-color: rgba(255,255,255,0.12);
      }

      .generator-layout {
        display: grid;
        grid-template-columns: minmax(320px, 430px) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }

      .panel {
        background: linear-gradient(180deg, rgba(16,16,16,0.96), rgba(8,8,8,0.97));
        border: 1px solid var(--border);
        box-shadow: 0 24px 60px var(--shadow);
      }

      .form-panel {
        padding: 22px 20px 18px;
      }

      .section-title {
        margin: 0 0 18px;
        font-size: 1.35rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .field {
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.74rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 12px 14px;
        font: inherit;
      }

      .field input:focus,
      .field textarea:focus {
        outline: 2px solid rgba(165, 30, 30, 0.22);
        border-color: rgba(255,255,255,0.20);
      }

      .field textarea {
        min-height: 120px;
        resize: vertical;
      }

      .hidden {
        display: none !important;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .button.primary {
        background: linear-gradient(180deg, var(--accent-2), var(--accent));
        border-color: rgba(255,255,255,0.12);
      }

      .share-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .share-btn {
        flex: 1 1 82px;
        min-width: 82px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 10px 12px;
        font: inherit;
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .preview-panel {
        padding: 16px;
      }

      .preview-shell {
        width: 100%;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        padding: 18px;
      }

      canvas {
        display: block;
        width: 100%;
        max-height: 72vh;
        height: auto;
        background: #000;
        border: 1px solid rgba(255,255,255,0.06);
      }

      .footer-note {
        margin-top: 16px;
        text-align: center;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
      }

      @media (max-width: 920px) {
        .generator-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="topbar">
        <div class="eyebrow">#OPERATIONVADH</div>
        <h1>Support Certificate</h1>
        <p class="subtitle">Choose a default campaign layout or create a custom certificate.</p>
      </div>

      <div class="mode-switch" aria-label="Certificate content mode selector">
        <button class="mode-btn active" data-mode="default" type="button">Default Content</button>
        <button class="mode-btn" data-mode="custom" type="button">Custom Content</button>
      </div>

      <main class="generator-layout">
        <section class="panel form-panel" aria-label="Certificate form">
          <h2 class="section-title">Certificate Details</h2>

          <div id="default-content" class="content-panel">
            <div class="field">
              <label>Campaign Message</label>
              <input type="text" readonly value="I stand with Operation Vadh to expose cybercrime and protect the internet." />
            </div>
            <div class="field">
              <label>Default Recipient</label>
              <input type="text" readonly value="Alex Morgan" />
            </div>
          </div>

          <div id="custom-content" class="content-panel hidden">
            <div class="field">
              <label for="nameInput">Full Name</label>
              <input id="nameInput" type="text" value="Alex Morgan" maxlength="35" />
            </div>

            <div class="field">
              <label for="handleInput">Alias / Handle</label>
              <input id="handleInput" type="text" value="@ghostwatcher" maxlength="28" />
            </div>

            <div class="field">
              <label for="messageInput">Support Statement</label>
              <textarea id="messageInput">I stand with Operation Vadh to expose cybercrime, protect the innocent, and strengthen digital safety.</textarea>
            </div>
          </div>

          <div class="button-row">
            <button class="button primary" id="generateBtn" type="button">Generate</button>
            <button class="button" id="downloadBtn" type="button">Download PNG</button>
          </div>

          <div class="share-row" aria-label="Share certificate">
            <button class="share-btn" data-share="x" type="button">X</button>
            <button class="share-btn" data-share="linkedin" type="button">LinkedIn</button>
            <button class="share-btn" data-share="telegram" type="button">Telegram</button>
            <button class="share-btn" data-share="whatsapp" type="button">WhatsApp</button>
          </div>
        </section>

        <section class="panel preview-panel" aria-label="Certificate preview">
          <div class="preview-shell">
            <canvas id="certificateCanvas" width="1200" height="760" aria-label="Generated certificate preview"></canvas>
          </div>
          <div class="footer-note">Default URL and QR code appear in both layouts.</div>
        </section>
      </main>
    </div>

    <script>
      const canvas = document.getElementById('certificateCanvas');
      const ctx = canvas.getContext('2d');
      const baseUrl = 'https://operation-vadh.github.io/';
      const defaultName = 'Alex Morgan';
      const defaultHandle = '@ghostwatcher';
      const defaultMessage = 'I stand with Operation Vadh to expose cybercrime and protect the internet.';

      const modeButtons = document.querySelectorAll('.mode-btn');
      const defaultPanel = document.getElementById('default-content');
      const customPanel = document.getElementById('custom-content');
      const nameInput = document.getElementById('nameInput');
      const handleInput = document.getElementById('handleInput');
      const messageInput = document.getElementById('messageInput');
      const state = { mode: 'default' };

      function getCurrentContent() {
        if (state.mode === 'default') {
          return {
            name: defaultName,
            handle: defaultHandle,
            message: defaultMessage
          };
        }

        return {
          name: (nameInput.value || 'Supporter').trim() || 'Supporter',
          handle: (handleInput.value || '@operationvadh').trim() || '@operationvadh',
          message: (messageInput.value || 'I stand with Operation Vadh.').trim() || 'I stand with Operation Vadh.'
        };
      }

      function setMode(mode) {
        state.mode = mode;

        modeButtons.forEach((button) => {
          button.classList.toggle('active', button.dataset.mode === mode);
        });

        defaultPanel.classList.toggle('hidden', mode !== 'default');
        customPanel.classList.toggle('hidden', mode !== 'custom');

        renderCertificate();
      }

      function wrapText(text, maxWidth) {
        const words = text.split(/\s+/).filter(Boolean);
        const lines = [];
        let current = '';

        for (const word of words) {
          const test = current ? current + ' ' + word : word;
          if (ctx.measureText(test).width > maxWidth && current) {
            lines.push(current);
            current = word;
          } else {
            current = test;
          }
        }

        if (current) lines.push(current);
        return lines.length ? lines : [''];
      }

      function fitTextSize(text, maxWidth, minSize, maxSize, weight) {
        let best = minSize;
        for (let size = maxSize; size >= minSize; size -= 2) {
          ctx.font = `${weight} ${size}px "JetBrains Mono", monospace`;
          if (ctx.measureText(text).width <= maxWidth) {
            best = size;
            break;
          }
        }
        return best;
      }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawQrCode() {
        if (!window.QRious) {
          ctx.fillStyle = '#b72424';
          ctx.fillRect(930, 560, 150, 150);
          ctx.fillStyle = '#f5f1ec';
          ctx.font = '700 18px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('QR', 1005, 640);
          return;
        }

        const qr = new QRious({
          value: baseUrl,
          size: 150,
          background: '#fff',
          foreground: '#0d0d0d'
        });

        const img = new Image();
        img.onload = function () {
          ctx.drawImage(img, 940, 550, 150, 150);
        };
        img.src = qr.toDataURL();
      }

      function renderCertificate() {
        const { name, handle, message } = getCurrentContent();
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        const bg = ctx.createRadialGradient(width / 2, height / 2, 80, width / 2, height / 2, width * 0.72);
        bg.addColorStop(0, '#171717');
        bg.addColorStop(0.45, '#0f0f0f');
        bg.addColorStop(1, '#000');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);

        for (let x = 0; x < width; x += 54) {
          ctx.strokeStyle = 'rgba(255,255,255,0.04)';
          ctx.beginPath();
          ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        }

        for (let y = 0; y < height; y += 54) {
          ctx.strokeStyle = 'rgba(255,255,255,0.04)';
          ctx.beginPath();
          ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
        }

        roundedRect(50, 42, width - 100, height - 84, 26);
        ctx.fillStyle = 'rgba(17,17,17,0.96)';
        ctx.fill();
        ctx.strokeStyle = '#8d1818';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#b72424';
        ctx.fillRect(90, 76, width - 180, 4);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#f5f1ec';
        ctx.font = '700 26px "JetBrains Mono", monospace';
        ctx.fillText('#OPERATIONVADH', width / 2, 116);

        ctx.fillStyle = '#d8d0c8';
        ctx.font = '600 20px "JetBrains Mono", monospace';
        ctx.fillText('OFFICIAL SUPPORT CERTIFICATE', width / 2, 156);

        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(180, 196);
        ctx.lineTo(width - 180, 196);
        ctx.stroke();

        ctx.fillStyle = '#f5f1ec';
        ctx.font = '500 20px "JetBrains Mono", monospace';
        ctx.fillText('This certificate is awarded to', width / 2, 246);

        const nameSize = fitTextSize(name, 760, 42, 102, 800);
        ctx.font = `800 ${nameSize}px "JetBrains Mono", monospace`;
        const nameLines = wrapText(name, 760);
        let currentY = 344;
        nameLines.forEach((line, index) => {
          ctx.fillText(line, width / 2, currentY + (index * (nameSize + 18)));
        });

        ctx.fillStyle = '#d7cfc4';
        ctx.font = '600 24px "JetBrains Mono", monospace';
        ctx.fillText(handle, width / 2, 463);

        ctx.strokeStyle = 'rgba(185, 34, 34, 0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(220, 500);
        ctx.lineTo(width - 220, 500);
        ctx.stroke();

        ctx.fillStyle = '#efe6df';
        ctx.font = '500 22px "JetBrains Mono", monospace';
        const messageLines = wrapText(message, 800);
        const messageStartY = 550;
        messageLines.slice(0, 3).forEach((line, index) => {
          ctx.fillText(line, width / 2, messageStartY + index * 38);
        });

        ctx.fillStyle = '#b72424';
        ctx.font = '700 19px "JetBrains Mono", monospace';
        ctx.fillText('WE FIGHT CYBER CRIME • WE PROTECT THE INTERNET', width / 2, 660);

        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.beginPath();
        ctx.moveTo(150, 690);
        ctx.lineTo(width - 150, 690);
        ctx.stroke();

        ctx.fillStyle = '#f5f1ec';
        ctx.font = '700 18px "JetBrains Mono", monospace';
        ctx.fillText('operation-vadh.github.io', width / 2, 714);

        ctx.fillStyle = '#b72424';
        ctx.fillRect(100, 620, 160, 58);
        ctx.fillStyle = '#111111';
        ctx.font = '800 38px "JetBrains Mono", monospace';
        ctx.fillText('V', 126, 662);

        drawQrCode();
      }

      modeButtons.forEach((button) => {
        button.addEventListener('click', () => setMode(button.dataset.mode));
      });

      document.getElementById('generateBtn').addEventListener('click', renderCertificate);

      document.getElementById('downloadBtn').addEventListener('click', function () {
        const { name } = getCurrentContent();
        const safeName = (name || 'supporter').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'supporter';
        const link = document.createElement('a');
        link.download = `operation-vadh-certificate-${safeName}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });

      document.querySelectorAll('.share-btn').forEach((button) => {
        button.addEventListener('click', function () {
          const platform = this.dataset.share;
          const shareText = `I support Operation Vadh and stand against cybercrime. ${baseUrl}`;
          const encodedText = encodeURIComponent(shareText);
          const encodedUrl = encodeURIComponent(baseUrl);

          let shareUrl = '';
          if (platform === 'x') shareUrl = `https://twitter.com/intent/tweet?text=${encodedText}`;
          if (platform === 'linkedin') shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`;
          if (platform === 'telegram') shareUrl = `https://t.me/share/url?url=${encodedUrl}&text=${encodedText}`;
          if (platform === 'whatsapp') shareUrl = `https://wa.me/?text=${encodedText}`;

          if (shareUrl) window.open(shareUrl, '_blank', 'noopener,noreferrer');
        });
      });

      setMode('default');
    </script>
  </body>
</html>
