<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operation Vadh | Brutalist Support Certificate</title>
    <meta name="description" content="Generate a dark, aggressive Operation Vadh support certificate and share it online." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
    <style>
      :root {
        --bg: #070707;
        --bg-2: #121212;
        --panel: rgba(18,18,18,0.98);
        --text: #f3eee9;
        --muted: #d2c8bf;
        --acid: #e7d8c9;
        --red: #b61a1a;
        --red-2: #d92d2d;
        --border: rgba(255,255,255,0.1);
        --shadow: rgba(0, 0, 0, 0.66);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 10% 10%, rgba(182, 26, 26, 0.14), transparent 18%),
          linear-gradient(180deg, #040404, #090909 30%, #050505);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
      }

      body {
        display: flex;
        justify-content: center;
        padding: 26px 18px 56px;
      }

      .page-shell {
        width: min(1260px, 100%);
      }

      .topbar {
        text-align: center;
        margin-bottom: 18px;
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 16px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: clamp(2rem, 4vw, 3.4rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        letter-spacing: 0.08em;
        font-size: 0.86rem;
      }

      .generator-layout {
        display: grid;
        grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }

      .panel {
        background: linear-gradient(180deg, rgba(16, 16, 16, 0.97), rgba(8, 8, 8, 0.97));
        border: 1px solid var(--border);
        box-shadow: 0 24px 52px var(--shadow);
      }

      .form-panel {
        padding: 22px 20px 18px;
      }

      .section-title {
        margin: 0 0 18px;
        font-size: 1.35rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .field {
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 0.74rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 12px 14px;
        font: inherit;
      }

      .field textarea {
        min-height: 120px;
        resize: vertical;
      }

      .field input:focus,
      .field textarea:focus {
        outline: 2px solid rgba(182, 26, 26, 0.28);
        border-color: rgba(255,255,255,0.18);
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .button.primary {
        background: linear-gradient(180deg, var(--red-2), var(--red));
        border-color: rgba(255,255,255,0.12);
      }

      .share-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .share-btn {
        flex: 1 1 82px;
        min-width: 82px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        padding: 10px 12px;
        font: inherit;
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .preview-panel {
        padding: 16px;
      }

      .preview-shell {
        width: 100%;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        padding: 18px;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        max-height: 72vh;
        background: #000;
        border: 1px solid rgba(255,255,255,0.06);
      }

      .footer-note {
        margin-top: 16px;
        text-align: center;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
      }

      @media (max-width: 920px) {
        .generator-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="topbar">
        <div class="eyebrow">#OPERATIONVADH</div>
        <h1>Support Certificate</h1>
        <p class="subtitle">Dark. Aggressive. Shareable. Built for the cause.</p>
      </div>

      <main class="generator-layout">
        <section class="panel form-panel" aria-label="Certificate form">
          <h2 class="section-title">Certificate Details</h2>

          <div class="field">
            <label for="nameInput">Full Name</label>
            <input id="nameInput" type="text" value="Alex Morgan" maxlength="32" />
          </div>

          <div class="field">
            <label for="messageInput">Support Statement</label>
            <textarea id="messageInput">I stand against the shadows. I support Operation Vadh and the fight against cybercrime.</textarea>
          </div>

          <div class="button-row">
            <button class="button primary" id="generateBtn" type="button">Generate</button>
            <button class="button" id="downloadBtn" type="button">Download PNG</button>
          </div>

          <div class="share-row" aria-label="Share certificate">
            <button class="share-btn" data-share="x" type="button">X</button>
            <button class="share-btn" data-share="linkedin" type="button">LinkedIn</button>
            <button class="share-btn" data-share="telegram" type="button">Telegram</button>
            <button class="share-btn" data-share="whatsapp" type="button">WhatsApp</button>
          </div>
        </section>

        <section class="panel preview-panel" aria-label="Certificate preview">
          <div class="preview-shell">
            <canvas id="certificateCanvas" width="1000" height="1320" aria-label="Generated certificate preview"></canvas>
          </div>
          <div class="footer-note">Dark brutalist layout • website and QR are always included.</div>
        </section>
      </main>
    </div>

    <script>
      const canvas = document.getElementById('certificateCanvas');
      const ctx = canvas.getContext('2d');
      const baseUrl = 'https://operation-vadh.github.io/';
      const nameInput = document.getElementById('nameInput');
      const messageInput = document.getElementById('messageInput');

      function getCurrentContent() {
        return {
          name: (nameInput.value || 'Supporter').trim() || 'Supporter',
          message: (messageInput.value || 'I stand against the shadows. I support Operation Vadh.').trim() || 'I stand against the shadows. I support Operation Vadh.'
        };
      }

      function wrapText(text, maxWidth) {
        const words = text.split(/\s+/).filter(Boolean);
        const lines = [];
        let current = '';

        for (const word of words) {
          const test = current ? current + ' ' + word : word;
          if (ctx.measureText(test).width > maxWidth && current) {
            lines.push(current);
            current = word;
          } else {
            current = test;
          }
        }

        if (current) lines.push(current);
        return lines.length ? lines : [''];
      }

      function fitTextSize(text, maxWidth, minSize, maxSize, weight) {
        let best = minSize;
        for (let size = maxSize; size >= minSize; size -= 2) {
          ctx.font = `${weight} ${size}px "JetBrains Mono", monospace`;
          if (ctx.measureText(text).width <= maxWidth) {
            best = size;
            break;
          }
        }
        return best;
      }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawQrCode() {
        const qrX = 688;
        const qrY = 840;
        const qrSize = 170;

        roundedRect(qrX - 18, qrY - 18, qrSize + 36, qrSize + 70, 8);
        ctx.fillStyle = '#121212';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#b61a1a';
        ctx.fillRect(qrX, qrY - 2, qrSize, 4);

        ctx.fillStyle = '#f3eee9';
        ctx.font = '700 16px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('SCAN TO VERIFY', qrX + 8, qrY - 18);

        if (!window.QRious) {
          ctx.fillStyle = '#b61a1a';
          ctx.fillRect(qrX + 18, qrY + 28, qrSize - 36, qrSize - 36);
          ctx.fillStyle = '#f3eee9';
          ctx.font = '700 18px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('QR', qrX + qrSize / 2, qrY + qrSize / 2 + 6);
          return;
        }

        const qr = new QRious({
          value: baseUrl,
          size: qrSize,
          background: '#ffffff',
          foreground: '#0d0d0d'
        });

        const img = new Image();
        img.onload = function () {
          ctx.drawImage(img, qrX + 18, qrY + 24, qrSize - 36, qrSize - 36);
        };
        img.src = qr.toDataURL();
      }

      function renderCertificate() {
        const { name, message } = getCurrentContent();
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        const bg = ctx.createRadialGradient(width / 2, height / 2, 80, width / 2, height / 2, width * 0.8);
        bg.addColorStop(0, '#141414');
        bg.addColorStop(0.45, '#0d0d0d');
        bg.addColorStop(1, '#030303');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        for (let x = 0; x < width; x += 48) {
          ctx.fillRect(x, 0, 1, height);
        }

        for (let y = 0; y < height; y += 48) {
          ctx.fillRect(0, y, width, 1);
        }

        ctx.fillStyle = '#0d0d0d';
        roundedRect(30, 28, width - 60, height - 56, 6);
        ctx.fill();
        ctx.strokeStyle = '#7b1313';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#b61a1a';
        ctx.fillRect(52, 60, width - 104, 8);

        ctx.textAlign = 'left';
        ctx.fillStyle = '#f3eee9';
        ctx.font = '700 18px "JetBrains Mono", monospace';
        ctx.fillText('#OPERATIONVADH', 72, 108);

        ctx.fillStyle = '#b61a1a';
        ctx.font = '700 18px "JetBrains Mono", monospace';
        ctx.textAlign = 'right';
        ctx.fillText('SUPPORTER CERTIFICATE', width - 72, 108);

        const nameSize = fitTextSize(name, 820, 46, 124, 800);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#f3eee9';
        ctx.font = `800 ${nameSize}px "JetBrains Mono", monospace`;
        const nameLines = wrapText(name, 760);
        let currentY = 410;
        nameLines.forEach((line, index) => {
          ctx.fillText(line, 84, currentY + index * (nameSize + 16));
        });

        ctx.fillStyle = '#b61a1a';
        ctx.font = '700 28px "JetBrains Mono", monospace';
        ctx.fillText('I STAND WITH THE CAUSE', 90, 620);

        ctx.strokeStyle = '#b61a1a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(92, 646);
        ctx.lineTo(520, 646);
        ctx.stroke();

        ctx.fillStyle = '#efe4d8';
        ctx.font = '500 30px "JetBrains Mono", monospace';
        const statementLines = wrapText(message, 640);
        statementLines.slice(0, 3).forEach((line, index) => {
          ctx.fillText(line, 90, 720 + index * 42);
        });

        ctx.fillStyle = '#b61a1a';
        ctx.font = '700 18px "JetBrains Mono", monospace';
        ctx.fillText('VISIT', 90, 950);
        ctx.fillStyle = '#f3eee9';
        ctx.fillText('operation-vadh.github.io', 170, 950);

        ctx.fillStyle = '#f3eee9';
        ctx.font = '700 22px "JetBrains Mono", monospace';
        ctx.fillText('FIGHT THE SHADOWS.', 90, 1010);

        ctx.fillStyle = '#b61a1a';
        ctx.fillRect(52, 1060, width - 104, 2);

        drawQrCode();

        ctx.fillStyle = '#f3eee9';
        ctx.font = '700 16px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('SCAN / VERIFY', 95, 1125);
      }

      nameInput.addEventListener('input', renderCertificate);
      messageInput.addEventListener('input', renderCertificate);

      document.getElementById('generateBtn').addEventListener('click', renderCertificate);

      document.getElementById('downloadBtn').addEventListener('click', function () {
        const { name } = getCurrentContent();
        const safeName = (name || 'supporter').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'supporter';
        const link = document.createElement('a');
        link.download = `operation-vadh-support-certificate-${safeName}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });

      document.querySelectorAll('.share-btn').forEach((button) => {
        button.addEventListener('click', function () {
          const platform = this.dataset.share;
          const shareText = `I stand with Operation Vadh. ${baseUrl}`;
          const encodedText = encodeURIComponent(shareText);
          const encodedUrl = encodeURIComponent(baseUrl);

          let shareUrl = '';
          if (platform === 'x') shareUrl = `https://twitter.com/intent/tweet?text=${encodedText}`;
          if (platform === 'linkedin') shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`;
          if (platform === 'telegram') shareUrl = `https://t.me/share/url?url=${encodedUrl}&text=${encodedText}`;
          if (platform === 'whatsapp') shareUrl = `https://wa.me/?text=${encodedText}`;

          if (shareUrl) window.open(shareUrl, '_blank', 'noopener,noreferrer');
        });
      });

      renderCertificate();
    </script>
  </body>
</html>
